name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (linux/arm64)
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi

          VERSION=${GITHUB_REF_NAME}
          COMMIT=${GITHUB_SHA::8}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/NodeSpy/vop/internal/version.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/NodeSpy/vop/internal/version.Commit=${COMMIT}"
          LDFLAGS="${LDFLAGS} -X github.com/NodeSpy/vop/internal/version.Date=${DATE}"

          mkdir -p dist
          go build -tags noupdate -ldflags "${LDFLAGS}" -o "dist/vop-${{ matrix.os }}-${{ matrix.arch }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/vop-${{ matrix.os }}-${{ matrix.arch }}

  deb:
    name: Build .deb (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: vop-linux-${{ matrix.arch }}
          path: dist/

      - name: Install nfpm
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.39.0/nfpm_2.39.0_Linux_x86_64.tar.gz \
            | tar -xz -C /tmp nfpm
          /tmp/nfpm --version

      - name: Build .deb
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Strip the leading 'v' from the tag for the .deb version field.
          export VERSION="${VERSION#v}"
          chmod +x "dist/vop-linux-${ARCH}"
          mkdir -p out

          # nfpm substitutes env vars in select top-level fields, but not in
          # `contents.src`. Pre-substitute the whole config via envsubst.
          envsubst '${VERSION} ${ARCH}' < nfpm.yaml > nfpm.resolved.yaml
          echo "--- resolved nfpm config ---"
          cat nfpm.resolved.yaml

          /tmp/nfpm pkg --packager deb --target out/ --config nfpm.resolved.yaml
          ls -la out/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: vop-deb-${{ matrix.arch }}
          path: out/*.deb

  release:
    name: Create Release
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Raw binaries (vop-linux-*, vop-darwin-*).
          for dir in artifacts/vop-linux-* artifacts/vop-darwin-*; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            cp "$dir/$binary" "release/$binary"
            chmod +x "release/$binary"
          done
          # .deb packages.
          for dir in artifacts/vop-deb-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.deb release/
          done

          # Create checksums for everything we're shipping.
          cd release
          sha256sum vop-* vop_*.deb > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/vop-*
            release/vop_*.deb
            release/checksums.txt

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SHA_DARWIN_ARM64=$(sha256sum release/vop-darwin-arm64 | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum release/vop-darwin-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum release/vop-linux-arm64 | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum release/vop-linux-amd64 | awk '{print $1}')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout latest main — it may have advanced since the tag was pushed
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          cat > Formula/vop.rb << 'RUBY'
          # typed: false
          # frozen_string_literal: true

          class Vop < Formula
            desc "AWS credential management via 1Password"
            homepage "https://github.com/NodeSpy/vop"
          RUBY

          cat >> Formula/vop.rb << EOF
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/NodeSpy/vop/releases/download/${VERSION}/vop-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/NodeSpy/vop/releases/download/${VERSION}/vop-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/NodeSpy/vop/releases/download/${VERSION}/vop-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/NodeSpy/vop/releases/download/${VERSION}/vop-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir["vop-*"].first || "vop"
              bin.install binary => "vop"
            end

            def caveats
              <<~EOS
                To let AI agents use vop for AWS credentials, install the vop skill:
                  vop skill install

                It writes a short pointer to ~/.claude/skills/vop/SKILL.md. The full
                instructions are printed by 'vop skill' straight from the binary, so
                they track upgrades and the stub never needs reinstalling.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/vop version")
            end
          end
          EOF

          git add Formula/vop.rb
          git commit -m "Update Homebrew formula for ${VERSION}"

          # Retry push with rebase in case main advanced during the build
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed (attempt $i), rebasing and retrying..."
            git pull --rebase origin main
          done

  nix:
    name: Update Nix flake
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump flake version and recompute vendorHash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLACEHOLDER='sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Bump version (single quoted-string assignment of `version`).
          sed -i "s/version = \"[^\"]*\";/version = \"${VERSION}\";/" flake.nix

          # Reset vendorHash to the placeholder so the build error tells us the real hash.
          sed -i "s|vendorHash = \"sha256-[A-Za-z0-9+/=]*\";|vendorHash = \"${PLACEHOLDER}\";|" flake.nix

          # First build is expected to fail with the correct hash in stderr.
          BUILD_LOG=$(nix build .#vop --no-link 2>&1 || true)
          echo "--- nix build (first pass, expected to fail) ---"
          echo "$BUILD_LOG"

          VENDOR_HASH=$(echo "$BUILD_LOG" | grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' | sed 's/got: *//' | tail -1)
          if [ -z "$VENDOR_HASH" ]; then
            echo "Failed to extract vendorHash from nix build output"
            exit 1
          fi
          echo "Computed vendorHash: $VENDOR_HASH"

          sed -i "s|vendorHash = \"${PLACEHOLDER}\";|vendorHash = \"${VENDOR_HASH}\";|" flake.nix

          # Verify the build now succeeds with the real hash.
          nix build .#vop --no-link

          if git diff --quiet flake.nix; then
            echo "flake.nix unchanged — nothing to commit"
            exit 0
          fi

          git add flake.nix
          git commit -m "Update Nix flake for ${GITHUB_REF_NAME}"

          # Retry push in case main advanced (Homebrew job pushes too).
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed (attempt $i), rebasing and retrying..."
            git pull --rebase origin main
          done

  aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare checksums
        run: |
          mkdir -p release
          # AUR only needs the raw linux binaries — skip .deb artifacts.
          for dir in artifacts/vop-linux-* artifacts/vop-darwin-*; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            cp "$dir/$binary" "release/$binary"
          done

      - name: Generate PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          SHA_LINUX_AMD64=$(sha256sum release/vop-linux-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum release/vop-linux-arm64 | awk '{print $1}')
          SHA_LICENSE=$(curl -fsSL "https://github.com/NodeSpy/vop/raw/${TAG}/LICENSE" | sha256sum | awk '{print $1}')

          # Use aur/PKGBUILD as the template, substitute version and checksums.
          cp aur/PKGBUILD PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_LINUX_AMD64}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_LINUX_ARM64}')/" PKGBUILD
          sed -i "s/^sha256sums+=.*/sha256sums+=('${SHA_LICENSE}')/" PKGBUILD

          echo "--- Generated PKGBUILD ---"
          cat PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: vop-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME }}
          commit_email: ${{ vars.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
